name: API Gateway CI

on:
  push:
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway-ci.yml"
  pull_request:
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway-ci.yml"

jobs:
  test:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api-gateway/go.mod
          cache-dependency-path: api-gateway/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify module dependencies
        run: go mod tidy -diff

      - name: Run gofmt check
        run: |
          test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: api-gateway

      - name: Run tests
        run: go test -v ./...
