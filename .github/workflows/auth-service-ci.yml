name: Auth Service CI

on:
  push:
    paths:
      - "auth-service/**"
      - ".github/workflows/auth-service-ci.yml"
  pull_request:
    paths:
      - "auth-service/**"
      - ".github/workflows/auth-service-ci.yml"

jobs:
  test:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: auth-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: auth-service/go.mod
          cache-dependency-path: auth-service/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify module dependencies
        run: go mod tidy -diff

      - name: Run gofmt check
        run: |
          test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: auth-service

      - name: Run tests
        run: go test -v ./...
