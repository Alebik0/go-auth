basePath: /api/v1
definitions:
  main.APIError:
    properties:
      error:
        example: just a random internal error
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Alebik0
  description: User service API, that provides CRUD operations to manage users
  license:
    name: MIT
    url: https://mit-license.org
  title: User service
  version: "1.0"
paths:
  /user/{id}:
    get:
      consumes:
      - application/json
      description: Reads user from Postgres database and returns as a JSON object
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/main.APIError'
        "404":
          description: Item not found
          schema:
            $ref: '#/definitions/main.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/main.APIError'
      summary: Read user CRUD operation
      tags:
      - User
swagger: "2.0"
